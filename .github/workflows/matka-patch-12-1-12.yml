name: Matka patch 12.1.12

on:
  push:
    paths:
      - '.github/workflows/matka-patch-12-1-12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 12.1.12 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Backend ---------------------------------------------------------
          path = Path("astro_weather_backend/astro_weather_backend.py")
          text = path.read_text(encoding="utf-8")
          text = once(text, 'APP_VERSION = "12.1.11"', 'APP_VERSION = "12.1.12"', "APP_VERSION")
          text = once(text, 'ASTRO_START_CARD_VERSION = 21', 'ASTRO_START_CARD_VERSION = 22', "card version")
          text = once(
              text,
              '"met_user_agent": "AstroWeatherBackend/12.1.11 https://github.com/Z0472/home-assistant-astro-weather",',
              '"met_user_agent": "AstroWeatherBackend/12.1.12 https://github.com/Z0472/home-assistant-astro-weather",',
              "MET user agent",
          )
          text = once(text, '"max_start_delay_minutes": 90,', '"max_start_delay_minutes": 120,', "start delay")

          old = '''def dew_penalty(margin: float | None) -> float:
    if margin is None:
        return 0.0
    if margin >= 5:
        return 0.0
    if margin >= 3:
        return (5 - margin) * 5
    if margin >= 2:
        return 10 + (3 - margin) * 10
    if margin >= 1:
        return 20 + (2 - margin) * 20
    return 50.0
'''
          new = '''def dew_penalty(margin: float | None) -> float:
    # Heated optics can tolerate dew risk. A small temperature/dew-point
    # margin is therefore a soft warning about atmospheric haze/fog risk;
    # actual MET fog remains a separate, much stronger factor.
    if margin is None:
        return 0.0
    if margin >= 3:
        return 0.0
    if margin >= 2:
        return (3 - margin) * 10
    if margin >= 1:
        return 10 + (2 - margin) * 10
    if margin >= 0.5:
        return 20 + (1 - margin) * 20
    return 40.0
'''
          text = once(text, old, new, "dew_penalty")

          old = '''    cloud_score = 0.0 if effective_cloud is None else 100.0 - effective_cloud
    score = max(0.0, min(100.0, cloud_score - dew_p - fog_p - wind_p))
    aerosol = aerosol_quality(row.get("aerosols"), options)
    seeing = seeing_quality(row.get("seeing"), options)
    score = max(0.0, score - aerosol["aerosolPenalty"])
    score = max(0.0, score - seeing["seeingPenalty"])
'''
          new = '''    cloud_p = 0.0 if effective_cloud is None else effective_cloud
    aerosol = aerosol_quality(row.get("aerosols"), options)
    seeing = seeing_quality(row.get("seeing"), options)
    score_penalties = {
        "cloud": cloud_p,
        "dew": dew_p,
        "fog": fog_p,
        "wind": wind_p,
        "aod": aerosol["aerosolPenalty"],
        "seeing": seeing["seeingPenalty"],
    }
    score = max(0.0, min(100.0, 100.0 - sum(score_penalties.values())))
'''
          text = once(text, old, new, "score breakdown")

          old = '''    if hard_bad:
        status = "bad"
    elif (
        strong_disagreement
        or moon_uncertain
        or (aerosol["aerosolUncertain"] and score >= options["marginal_score"])
        or (seeing["seeingUncertain"] and score >= options["marginal_score"])
    ):
        status = "uncertain"
    elif score >= options["good_score"] and confidence >= 50:
        status = "good"
    elif score >= options["marginal_score"]:
        status = "partial"
    else:
        status = "bad"

    return {
'''
          new = '''    if hard_bad:
        status = "bad"
    elif (
        strong_disagreement
        or moon_uncertain
        or (aerosol["aerosolUncertain"] and score >= options["marginal_score"])
        or (seeing["seeingUncertain"] and score >= options["marginal_score"])
    ):
        status = "uncertain"
    elif score >= options["good_score"] and confidence >= 50:
        status = "good"
    elif score >= options["marginal_score"]:
        status = "partial"
    else:
        status = "bad"

    penalty_labels = {
        "cloud": "oblačnost",
        "dew": "rosa/opar",
        "fog": "mlha",
        "wind": "vítr",
        "aod": "AOD",
        "seeing": "seeing",
    }
    if precip is not None and precip > 0:
        dominant_penalty = {"key": "precip", "label": "srážky", "points": 100.0}
    elif moon_interferes:
        dominant_penalty = {"key": "moon", "label": "Měsíc", "points": 100.0}
    else:
        dominant_key, dominant_points = max(score_penalties.items(), key=lambda item: item[1])
        dominant_penalty = (
            {
                "key": dominant_key,
                "label": penalty_labels[dominant_key],
                "points": round(dominant_points, 1),
            }
            if dominant_points > 0.05
            else None
        )

    return {
'''
          text = once(text, old, new, "dominant penalty")

          old = '''        "score": round(score, 1),
        "confidence": round(confidence, 1),
        "reasons": reasons,
'''
          new = '''        "score": round(score, 1),
        "confidence": round(confidence, 1),
        "dominantPenalty": dominant_penalty,
        "scorePenalties": {key: round(value, 1) for key, value in score_penalties.items()},
        "reasons": reasons,
'''
          text = once(text, old, new, "hour return fields")
          path.write_text(text, encoding="utf-8")

          # Add-on metadata -------------------------------------------------
          path = Path("astro_weather_backend/config.yaml")
          text = path.read_text(encoding="utf-8")
          text = once(text, 'version: "12.1.11"', 'version: "12.1.12"', "config version")
          text = once(
              text,
              'met_user_agent: "AstroWeatherBackend/12.1.11 https://github.com/Z0472/home-assistant-astro-weather"',
              'met_user_agent: "AstroWeatherBackend/12.1.12 https://github.com/Z0472/home-assistant-astro-weather"',
              "config user agent",
          )
          text = once(text, "max_start_delay_minutes: 90", "max_start_delay_minutes: 120", "config start delay")
          path.write_text(text, encoding="utf-8")

          # Main decision card ---------------------------------------------
          path = Path("astro_weather_backend/cards/astro-start-card.js")
          card = path.read_text(encoding="utf-8")
          card = once(
              card,
              "// astro-start-card v21 - direct CAMS/Open-Meteo and 7Timer source links.",
              "// astro-start-card v22 - dominant score penalty shown per hour.",
              "card header",
          )
          start = card.index("  _hourLimit(h) {")
          end = card.index("\n  _aerosolInfo(a) {", start)
          replacement = '''  _hourLimit(h) {
    const reasons = Array.isArray(h?.reasons) ? h.reasons.filter(Boolean).map(String) : [];
    const joined = reasons.join(", ");
    const status = h?.status || "unknown";
    const baseTone = status === "bad" ? "bad" : status === "good" ? "good" : "warning";
    const dominant = h?.dominantPenalty;
    const points = Number(dominant?.points);
    const compactLabels = {
      cloud: "mraky",
      dew: "rosa",
      fog: "mlha",
      wind: "vítr",
      aod: "AOD",
      seeing: "seeing",
      precip: "srážky",
      moon: "Měsíc",
    };
    const title = reasons.length
      ? `Hlavní omezení: ${joined}.`
      : status === "good"
        ? "Hodina je vhodná pro focení."
        : "Hodina nemá konkrétní důvod z backendu, rozhodlo nízké celkové skóre.";

    if (dominant && typeof dominant.label === "string" && Number.isFinite(points) && points > 0.05) {
      const shortLabel = compactLabels[dominant.key] || dominant.label;
      const rounded = Math.round(points);
      const detail = `${title} Největší bodová ztráta: ${dominant.label} -${points.toFixed(1).replace(".", ",")} b.`;
      return { label: `${shortLabel} -${rounded}`, tone: baseTone, title: detail };
    }

    if (status === "good") return { label: "OK", tone: "good", title };
    if (status === "partial") return { label: "hraniční", tone: "warning", title };
    if (status === "uncertain") return { label: "nejisté", tone: "warning", title };
    return { label: "nízké skóre", tone: "bad", title };
  }
'''
          card = card[:start] + replacement + card[end:]
          path.write_text(card, encoding="utf-8")

          versioned = Path("cards/astro-start-card-v22.txt")
          if versioned.exists():
              raise SystemExit("cards/astro-start-card-v22.txt already exists")
          versioned.write_text(card, encoding="utf-8")

          # Tests -----------------------------------------------------------
          path = Path("tests/test_astro_weather_backend.py")
          tests = path.read_text(encoding="utf-8")
          tests = tests.replace('astro v21', 'astro v22')
          tests = tests.replace('astro-start-card-v21.js', 'astro-start-card-v22.js')
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in tests:
              raise SystemExit("test insertion marker missing")
          methods = '''
    def test_dew_penalty_is_soft_and_reports_dominant_factor(self):
        self.assertEqual(b.dew_penalty(3.0), 0.0)
        self.assertAlmostEqual(b.dew_penalty(2.0), 10.0)
        self.assertAlmostEqual(b.dew_penalty(1.0), 20.0)
        self.assertAlmostEqual(b.dew_penalty(0.9), 22.0)
        self.assertAlmostEqual(b.dew_penalty(0.5), 30.0)
        self.assertEqual(b.dew_penalty(0.4), 40.0)

        row = self.forecast(0.1)[0]
        row["met"]["dew_point"] = 14.1
        scored = b.score_hour(row, None, self.night, self.options)
        self.assertAlmostEqual(scored["score"], 78.0)
        self.assertEqual(scored["dominantPenalty"]["key"], "dew")
        self.assertAlmostEqual(scored["dominantPenalty"]["points"], 22.0)

    def test_default_launch_window_accepts_block_starting_two_hours_late(self):
        self.assertEqual(self.options["max_start_delay_minutes"], 120)
        rows = self.forecast(0.1)
        for row in rows[:2]:
            row["met"]["cloud_total"] = 100
            row["aladin"]["cloud_total"] = 100
        analysis = self.analyze(rows)
        self.assertEqual(analysis["decision"], "good")
        self.assertEqual(analysis["launchBlock"]["hours"], 6)

'''
          tests = tests.replace(marker, "\n" + methods + marker, 1)
          path.write_text(tests, encoding="utf-8")

          # Documentation ---------------------------------------------------
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("12.1.11", "12.1.12")
          text = text.replace("astro-start-card-v21", "astro-start-card-v22")
          path.write_text(text, encoding="utf-8")

          path = Path("astro_weather_backend/README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("12.1.11", "12.1.12")
          text = text.replace("astro-start-card-v21", "astro-start-card-v22")
          rules_marker = "## Default Rules\n"
          tuning = '''## Decision changes in 12.1.12

- A continuous good block still has to be at least 4 hours long.
- The default latest block start is 120 minutes after astronomical darkness begins.
- Dew-point margin is a soft atmospheric haze/fog-risk factor because optics can be heated.
- MET `fog_area_fraction` remains a separate strong fog penalty/veto.
- Hourly output includes `scorePenalties` and `dominantPenalty`; the card shows the largest point loss.

'''
          text = once(text, rules_marker, tuning + rules_marker, "backend README rules")
          path.write_text(text, encoding="utf-8")

          path = Path("cards/README.md")
          text = path.read_text(encoding="utf-8").replace("astro-start-card-v21", "astro-start-card-v22")
          path.write_text(text, encoding="utf-8")

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          entry = '''## 12.1.12 - 2026-09-11
- Soften the dew-point-margin penalty: heated optics can tolerate dew risk, so low ΔT is now a warning about atmospheric haze/fog rather than an automatic near-stop.
- Keep MET `fog_area_fraction` as the separate strong fog penalty/veto.
- Publish per-hour `scorePenalties` plus `dominantPenalty` and show the largest point loss directly on each hourly tile.
- Increase the default latest acceptable start of a four-hour good block from 90 to 120 minutes after astronomical darkness begins.
- Bump the main decision card to `astro-start-card-v22.js`.

'''
          path.write_text(entry + text, encoding="utf-8")
          PY

      - name: Run checks
        run: |
          python3 -m py_compile astro_weather_backend/astro_weather_backend.py
          python3 -m unittest -v tests/test_astro_weather_backend.py

      - name: Commit changes and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/matka-patch-12-1-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 12.1.12 scoring and start-window tuning"
          git push
