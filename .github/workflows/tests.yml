name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m py_compile astro_weather_backend/astro_weather_backend.py
          python -m py_compile astro_weather_backend/weather_models.py
          python -m py_compile astro_weather_backend/cloud_consensus.py
          python -m py_compile astro_weather_backend/model_runtime.py
          python -m py_compile astro_weather_backend/confidence_patch.py
          python -m py_compile astro_weather_backend/night_forecast_patch.py
          python -m py_compile astro_weather_backend/spatial_cloud_patch.py
          python -m py_compile astro_weather_backend/spatial_timeline_patch.py
          python -m py_compile astro_weather_backend/twilight_patch.py
          python -m py_compile astro_weather_backend/state_cache_patch.py
          python -m py_compile astro_weather_backend/app.py
      - name: Check card JavaScript syntax
        run: |
          node --check astro_weather_backend/cards/astro-start-card-v23.js
          node --check astro_weather_backend/cards/astro-start-card-v24.js
          node --check astro_weather_backend/cards/astro-start-card-v25.js
          node --check astro_weather_backend/cards/astro-start-card-v26.js
          node --check astro_weather_backend/cards/astro-start-card-v27.js
          node --check astro_weather_backend/cards/moon-forecast-card-v24.js
          node --check astro_weather_backend/cards/moon-forecast-card-v25.js
      - name: Stable 12.1 regression suite
        run: python -m unittest -v tests/test_astro_weather_backend.py
      - name: ICON and multi-model regression suite
        run: python -m unittest -v tests/test_model_consensus.py
      - name: Confidence regression suite
        run: python -m unittest -v tests/test_confidence_patch.py
      - name: Night forecast regression suite
        run: python -m unittest -v tests/test_night_forecast_patch.py
      - name: Spatial cloud regression suite
        run: python -m unittest -v tests/test_spatial_cloud_patch.py
      - name: Spatial timeline regression suite
        run: python -m unittest -v tests/test_spatial_timeline_patch.py
      - name: Twilight display regression suite
        run: python -m unittest -v tests/test_twilight_patch.py
      - name: State cache regression suite
        run: python -m unittest -v tests/test_state_cache_patch.py
      - name: Release wiring regression suite
        run: python -m unittest -v tests/test_release_wiring.py
      - name: Build Home Assistant app container
        run: docker build --build-arg BUILD_VERSION=12.3.2 --build-arg BUILD_ARCH=amd64 -f astro_weather_backend/Dockerfile astro_weather_backend
