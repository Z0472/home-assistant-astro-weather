name: Matka fix missing-cloud 12.1.12

on:
  push:
    paths:
      - '.github/workflows/matka-fix-missing-cloud-12-1-12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply regression fix
        run: python3 .github/matka_fix_missing_cloud_12_1_12.py
      - name: Run checks
        run: |
          python3 -m py_compile astro_weather_backend/astro_weather_backend.py
          python3 -m unittest -v tests/test_astro_weather_backend.py
      - name: Commit fix and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/matka-fix-missing-cloud-12-1-12.yml
          rm .github/matka_fix_missing_cloud_12_1_12.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve zero score when cloud models are unavailable"
          git push
